services:
  postgres:
    build: ./docker/postgres
    image: buddygo-postgres:17-postgis
    container_name: buddygo-postgres
    environment:
      POSTGRES_DB: buddygo
      POSTGRES_USER: buddygo
      POSTGRES_PASSWORD: buddygo
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddygo -d buddygo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
