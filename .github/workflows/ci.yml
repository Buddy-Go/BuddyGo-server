name: CI

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev" ]

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 통합 테스트(@SpringBootTest)가 실제 PostgreSQL(PostGIS)과 Redis에 붙는다.
    # 로컬은 arm64 때문에 docker/postgres 이미지를 직접 빌드하지만, 러너는 amd64라 공식 postgis 이미지를 쓴다.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: buddygo
          POSTGRES_USER: buddygo
          POSTGRES_PASSWORD: buddygo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buddygo -d buddygo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # application-local.yaml은 gitignore 대상이라 CI에선 환경변수로 주입한다.
    env:
      DB_URL: jdbc:postgresql://localhost:5432/buddygo
      DB_USERNAME: buddygo
      DB_PASSWORD: buddygo
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-secret-key-not-used-anywhere-0123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
