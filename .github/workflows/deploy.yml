name: Deploy

# dev에 push되어 CI(테스트 포함)가 성공한 커밋만 배포한다. 수동 실행은 dev의 최신 커밋을 배포한다.
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "dev" ]
  workflow_dispatch:

# 배포는 끝까지 가야 한다. 도중에 끊기면 서버가 어중간한 상태로 남으므로 취소하지 않고 순서대로 돈다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  # docker 이미지 이름은 소문자여야 한다 (github.repository는 Buddy-Go/BuddyGo-server).
  IMAGE: ghcr.io/buddy-go/buddygo-server
  DEPLOY_DIR: /home/ubuntu/buddygo

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve commit
        id: commit
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 서버는 x86(t3) 기준이라 amd64만 만든다. 커밋 SHA 태그로 배포하고, latest는 편의용이다.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.commit.outputs.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 서버의 배포 파일은 매번 레포 내용으로 덮어쓴다(서버에서 직접 고치지 않는다). .env와 secrets/는 보내지 않는다.
      # docker/postgres는 서버에서 PostGIS 이미지를 빌드하는 데 필요하다.
      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile,docker/postgres/Dockerfile"
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SHA,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          command_timeout: 10m
          script: |
            set -e
            cd "$DEPLOY_DIR"

            # 배포한 태그를 .env에 남겨, 나중에 서버에서 직접 docker compose up 해도 같은 이미지가 뜨게 한다.
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$SHA/" .env

            # 패키지가 private이어도 받을 수 있게 이 잡의 토큰으로 잠깐 로그인한다 (잡이 끝나면 토큰은 만료된다).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # postgres는 서버에서 빌드하는 이미지라 pull 대상에서 뺀다.
            docker compose pull app
            docker logout ghcr.io

            # down 하지 않는다. 바뀐 컨테이너(보통 app)만 다시 만든다.
            docker compose up -d --build --remove-orphans

            # 앱이 실제로 응답할 때까지 기다린다. Flyway 마이그레이션이 길면 시간이 걸린다.
            for i in $(seq 1 36); do
              if curl -fs -o /dev/null http://127.0.0.1:8080/v3/api-docs; then
                echo "app is up ($SHA)"
                docker image prune -f
                exit 0
              fi
              sleep 5
            done
            echo "app did not become ready in 3 minutes" >&2
            docker compose logs --tail=200 app
            exit 1
