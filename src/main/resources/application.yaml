spring:
  application:
    name: buddygo-server
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  swagger-ui:
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json
