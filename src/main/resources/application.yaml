spring:
  application:
    name: buddygo-server
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

jwt:
  # HS256 서명 키. 32바이트(영문 기준 32자) 이상이어야 하며 없으면 기동에 실패한다.
  secret: ${JWT_SECRET}
  issuer: buddygo
  audience: buddygo-app
  access-token-ttl: 30m
  refresh-token-ttl: 14d

app:
  # 서비스 기준 시간대. 저장·응답은 UTC Instant 이고, 날짜·시간대 조건 해석에만 쓴다 (TimeConfig)
  time-zone: Asia/Seoul

# 서비스 규칙 정의서 0장의 설정값. 바뀔 수 있어 코드에 쓰지 않는다.
gathering:
  # 데드라인 = 시작 - 이 값. 개설·시작 시각 변경은 지금 + 이 값 이후만 된다.
  deadline-before-start: 90m
  # 시작 시각 단위. 시작 시각은 이 단위의 정각(초 0)이어야 한다.
  start-time-step: 10m
  # 정원(호스트 포함)
  min-capacity: 2
  max-capacity: 3
  # 진행 시간
  min-duration: 30m
  max-duration: 4h
  duration-step: 10m

check-in:
  # 체크인 열림 = 시작 - 이 값
  open-before-start: 10m
  # 시작 후 이 값부터 지각
  late-after-start: 5m
  # 시작 후 이 값까지 체크인하지 않으면 노쇼
  no-show-after-start: 10m
  # 모임 장소에서 이 거리(m) 안에서만 체크인된다
  radius-meters: 50

review:
  # 평가 기한: 모임 종료 후 이 기간 안에만 평가할 수 있다
  deadline-after-end: 3d
  # 평가 한 건의 점수 = 판정 기본 점수 + 긍정 태그 수 × positive-tag + 부정 태그 수 × negative-tag (규칙 정의서 11장, 값은 임시)
  # 태그 점수는 판정과 상관없이 태그 성격대로 더하되, 좋음은 0 아래로·아쉬움은 0 위로 가지 않게 자른다(보통은 태그대로).
  # 실제 온도 변화는 이 점수에 곡선(manner-temperature)을 적용한 값이다.
  score:
    good: 0.5
    normal: 0
    bad: -0.5
    positive-tag: 0.1
    negative-tag: -0.1
  # 프로필의 '많이 받은 태그' 개수. 아쉬움 평가의 태그는 비공개라 세지 않는다.
  profile-top-tags: 3

manner-temperature:
  # 시작값이자 곡선의 기준점. users.manner_temperature 의 기본값(36.5)과 같아야 한다.
  neutral: 36.5
  # 오를 때는 (max - 현재) / (max - neutral), 내릴 때는 현재 / neutral 을 곱한다(둘 다 1 이 넘지 않게 자름).
  # 그래서 max 에 가까울수록 덜 오르고 0 에 가까울수록 덜 내려가며, max 와 0 에는 닿지 않는다.
  max: 100
  # 시스템이 자동으로 내리는 점수(곡선에 넣기 전, 음수). 지각 < 노쇼, 데드라인 전 < 후, 모집중 취소 < 마감 후 취소 크기여야 한다.
  penalty:
    # 시작 후 check-in.no-show-after-start 까지 체크인하지 않음
    no-show: -5
    # 지각 체크인
    late: -1
    # 마감된 모임에서 데드라인 전에 나감(마감이 풀려 다시 모집). 다시 들어와 또 나가면 또 들어간다
    leave-before-deadline: -2
    # 마감된 모임에서 데드라인 후에 나감(모임 취소, 방폭)
    leave-after-deadline: -5
    # 호스트 취소 · 모집중(확정 참가자 있음)
    host-cancel-recruiting: -2
    # 호스트 취소 · 마감 후
    host-cancel-closed: -5
  # 시스템이 자동으로 올리는 점수(곡선에 넣기 전, 양수)
  bonus:
    # 종료된 모임에서 호스트가 체크인(정상·지각)함. 참가자가 모두 노쇼여도 준다
    host-attendance: 1.0

scheduler:
  # 테스트에서는 build.gradle 이 false 로 끈다(공유 로컬 DB 를 건드리지 않도록)
  enabled: true
  # 모임 상태 전이(데드라인 미달 취소, 진행중, 노쇼, 종료) 주기는 따로 두지 않는다. 전이 시점이 모두
  # gathering.* · check-in.open-before-start · check-in.no-show-after-start 의 최대공약수 간격(지금 10분) 정각에 놓이므로 그 간격으로 돈다
  # (GatheringStatusScheduler.tickOf).

gym:
  criteria:
    # 기준 범위: 호스트 기록 ±이 값. 팔은 숙련도가 같아야 한다.
    weight-tolerance-kg: 10
    reps-tolerance: 2

auth:
  login-attempt:
    max-failures: 5
    window: 15m

springdoc:
  swagger-ui:
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json

push:
  # Firebase 서비스 계정 JSON 파일 경로. 비우면 푸시를 보내지 않는다(앱 알림 목록은 그대로 저장).
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  # 알림 제목. 본문은 앱 알림 문구 그대로다.
  title: 버디고
  # 커밋 후 푸시를 보내는 스레드 풀. 큐가 차면 그 푸시는 버린다.
  executor:
    pool-size: 2
    queue-capacity: 1000
