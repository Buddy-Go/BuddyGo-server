spring:
  application:
    name: buddygo-server
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

jwt:
  # HS256 서명 키. 32바이트(영문 기준 32자) 이상이어야 하며 없으면 기동에 실패한다.
  secret: ${JWT_SECRET}
  issuer: buddygo
  audience: buddygo-app
  access-token-ttl: 30m
  refresh-token-ttl: 14d

app:
  # 서비스 기준 시간대. 저장·응답은 UTC Instant 이고, 날짜·시간대 조건 해석에만 쓴다 (TimeConfig)
  time-zone: Asia/Seoul

# 서비스 규칙 정의서 0장의 설정값. 바뀔 수 있어 코드에 쓰지 않는다.
gathering:
  # 데드라인 = 시작 - 이 값. 개설·시작 시각 변경은 지금 + 이 값 이후만 된다.
  deadline-before-start: 90m
  # 시작 시각 단위. 시작 시각은 이 단위의 정각(초 0)이어야 한다.
  start-time-step: 10m
  # 정원(호스트 포함)
  min-capacity: 2
  max-capacity: 3
  # 진행 시간
  min-duration: 30m
  max-duration: 4h
  duration-step: 10m

check-in:
  # 체크인 열림 = 시작 - 이 값
  open-before-start: 10m
  # 시작 후 이 값부터 지각
  late-after-start: 5m
  # 시작 후 이 값까지 체크인하지 않으면 노쇼
  no-show-after-start: 10m
  # 모임 장소에서 이 거리(m) 안에서만 체크인된다
  radius-meters: 50

review:
  # 평가 기한: 모임 종료 후 이 기간 안에만 평가할 수 있다
  deadline-after-end: 3d

scheduler:
  # 테스트에서는 build.gradle 이 false 로 끈다(공유 로컬 DB 를 건드리지 않도록)
  enabled: true
  # 모임 상태 전이(데드라인 미달 취소, 진행중, 종료) 확인 주기. 전이는 최대 이만큼 늦을 수 있어
  # API 는 상태값과 함께 시각으로도 판정한다.
  gathering-status-delay: PT30S

gym:
  criteria:
    # 기준 범위: 호스트 기록 ±이 값. 팔은 숙련도가 같아야 한다.
    weight-tolerance-kg: 10
    reps-tolerance: 2

auth:
  login-attempt:
    max-failures: 5
    window: 15m

springdoc:
  swagger-ui:
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json
